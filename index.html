<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FitTrack</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
:root{--bg:#1b1410;--card:#241c16;--card2:#2d241c;--text:#f0e6d8;--sub:#b3a08c;--accent:#5CA8FF;--accent2:#FF7A45;--danger:#ff6b6b;--border:#3a2f25;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f2e9d8;--card:#fbf5ea;--card2:#ede0c8;--text:#3a2f22;--sub:#8a7962;--accent:#2F6FE0;--accent2:#d9660f;--border:#ddcba8}}
:root[data-theme="dark"]{--bg:#1b1410}
html,body{height:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{flex:0 0 auto;padding:14px 18px 10px;background:var(--bg);border-bottom:1px solid var(--border)}
h1{font-size:20px;margin:0;font-weight:800;letter-spacing:-.02em}
.sub{color:var(--sub);font-size:12.5px;margin-top:3px}
main{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;max-width:640px;width:100%;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:14px}
.card h2{font-size:13px;margin:0 0 12px;color:var(--sub);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
label{font-size:12px;color:var(--sub);display:block;margin:10px 0 4px}
input,select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--card2);color:var(--text);font-size:15px}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}
button{border:none;border-radius:10px;padding:11px 16px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit}
.btn-primary{background:var(--accent);color:#fff;width:100%;margin-top:14px}
.btn-ghost{background:var(--card2);color:var(--text)}
.btn-sm{padding:6px 10px;font-size:12px}
.set-row{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:6px;margin-bottom:6px}
.set-row button{background:var(--card2);color:var(--danger);padding:8px}
.tabbar{flex:0 0 auto;display:flex;background:var(--card);border-top:1px solid var(--border)}
.tabbar button{flex:1;background:none;border-radius:0;padding:10px 4px 8px;color:var(--sub);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:600}
.tabbar button.active{color:var(--accent)}
.tabbar .ic{font-size:18px}
.item{padding:10px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:8px}
.item:last-child{border-bottom:none}
.pill{font-size:11px;background:var(--card2);border-radius:20px;padding:2px 9px;color:var(--sub)}
.progress{height:10px;background:var(--card2);border-radius:999px;overflow:hidden;margin-top:10px}
.progress>div{height:100%;background:linear-gradient(90deg,var(--accent),#7dd3fc);border-radius:999px;transition:width .4s ease}
.goal-hero{padding:18px;margin-bottom:14px;border-radius:18px;background:linear-gradient(145deg,var(--card),var(--card2));border:1px solid var(--accent);box-shadow:0 8px 28px rgba(0,0,0,.12)}
.goal-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.goal-title{font-size:19px;font-weight:800;line-height:1.2}
.goal-subtitle{font-size:12px;color:var(--sub);margin-top:4px}
.goal-percent{font-size:24px;font-weight:900;color:var(--accent);white-space:nowrap}
.goal-dual{display:grid;gap:14px;margin:18px 0 8px}.metric-track{background:var(--bg);border:1px solid var(--border);border-radius:14px;padding:11px}.metric-head{display:flex;justify-content:space-between;gap:8px;font-size:11px;margin-bottom:8px}.metric-head span{color:var(--sub)}.goal-progress-wrap{margin:18px 0 8px}
.goal-progress{height:14px;background:var(--bg);border-radius:999px;padding:2px;overflow:hidden;border:1px solid var(--border)}
.goal-progress>div{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),#7dd3fc);transition:width .5s ease}.goal-metric-card{background:var(--card2);border:1px solid var(--border);border-radius:15px;padding:12px;margin-top:12px}.goal-three-values{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:10px}.goal-three-values span{display:flex;flex-direction:column;gap:2px;padding:7px 5px;text-align:center;background:var(--bg);border-radius:10px}.goal-three-values small{font-size:9px;color:var(--sub);text-transform:uppercase;letter-spacing:.05em}.goal-three-values b{font-size:13px}.goal-three-values .current{border:1px solid var(--accent)}
.goal-scale{display:flex;justify-content:space-between;font-size:10.5px;color:var(--sub)}
.goal-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0 10px}
.goal-stat{background:var(--bg);border-radius:12px;padding:10px;text-align:center}
.goal-stat b{display:block;font-size:16px}
.goal-stat span{display:block;font-size:10px;color:var(--sub);margin-top:3px}
.goal-motivation{text-align:center;font-size:12px;color:var(--sub);margin-top:12px}
.goal-secondary{padding:12px 0;border-bottom:1px solid var(--border)}
.goal-secondary:last-child{border-bottom:none}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center;margin:12px 0}
.stat b{display:block;font-size:19px}
.stat span{font-size:10.5px;color:var(--sub)}
.chart-wrap{position:relative;height:210px}
.empty{color:var(--sub);font-size:13px;text-align:center;padding:18px 0}
.tag-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.tag{padding:6px 12px;border-radius:20px;background:var(--card2);font-size:12.5px;color:var(--sub);cursor:pointer;border:1px solid transparent}
.tag.active{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}
</style>
</head>
<body>
<header><h1>🏋️ FitTrack</h1><div class="sub" id="headerSub">Tu progreso, tu ritmo</div></header>
<main id="main"></main>
<nav class="tabbar">
<button data-tab="entrenar" class="active"><span class="ic">🏋️</span>Entrenar</button>
<button data-tab="rutinas"><span class="ic">📋</span>Rutinas</button>
<button data-tab="progreso"><span class="ic">📈</span>Progreso</button>
<button data-tab="objetivos"><span class="ic">🎯</span>Objetivos</button>
<button data-tab="medidas"><span class="ic">📏</span>Medidas</button>
</nav>
<script>
let state={workouts:[],measurements:[],goals:[],routines:[],cardio:[]};
let currentTab='entrenar',charts={},db=null,useDb=false,entrenarModo='fuerza';
let draftCardio={tipo:'correr',fecha:today(),km:'',tiempo:'',largos:'',sets:'',tiempoSet:'',esfuerzo:'70'};
let draftEx='',draftDate=today();
let draftSets=[{peso:'',reps:'',esfuerzo:'80'}];
let selectedExProgreso=null,selectedMedMetric='peso';
let draftRoutine={nombre:'',ejercicios:[]},activeRoutine=null,editingRoutineId=null;
let draftMed={fecha:today(),sexo:'M',edad:'',peso:'',altura:'',cuello:'',pecho:'',biceps:'',pierna:'',cintura:'',cadera:''};
let draftGoal={tipo:'definicion',sub:'medio',valor:'',meses:'3',act:'lig'};
let editingGoalId=null;
const main=document.getElementById('main');

function today(){return new Date().toISOString().slice(0,10);}
function fmtDate(d){try{return new Date(d+'T00:00:00').toLocaleDateString('es-ES',{day:'2-digit',month:'short'});}catch(e){return d;}}
function exerciseNames(){return [...new Set(state.workouts.map(w=>w.ejercicio))];}

function lsKey(c){return 'fittrack_'+c;}
function lsGetAll(c){try{return JSON.parse(localStorage.getItem(lsKey(c))||'[]');}catch(e){return [];}}
function lsSetAll(c,arr){try{localStorage.setItem(lsKey(c),JSON.stringify(arr));}catch(e){}}
async function getAll(col){
  if(useDb){
    try{
      const snap=await db.collection(col).orderBy('fecha','desc').get();
      const rows=snap.docs.map(d=>({id:d.id,...d.data()}));
      // Mantener una copia local de respaldo para que los datos sigan disponibles
      // aunque temporalmente no haya conexión con la base de datos.
      lsSetAll(col,rows);
      return rows;
    }catch(e){
      console.warn('Base de datos no disponible; usando copia local de respaldo',e);
    }
  }
  return lsGetAll(col).slice().sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||''));
}
async function addDoc(col,data){
  const id='id'+Date.now()+Math.random().toString(36).slice(2,7);
  const record={id,...data};
  // Guardado local siempre: actúa como persistencia inmediata y copia de seguridad.
  const arr=lsGetAll(col);arr.push(record);lsSetAll(col,arr);
  if(useDb){try{await db.collection(col).doc(id).set(data);}catch(e){console.warn('No se pudo sincronizar con la base de datos; la copia local se conserva',e);}}
  return id;
}
async function updateDoc(col,id,data){
  const arr=lsGetAll(col);
  const i=arr.findIndex(x=>x.id===id);
  if(i>-1){arr[i]={...arr[i],...data};lsSetAll(col,arr);}
  if(useDb){try{await db.collection(col).doc(id).set(data,{merge:true});}catch(e){console.warn('No se pudo sincronizar la edición; la copia local se conserva',e);}}
}
async function delDoc(col,id){
  lsSetAll(col,lsGetAll(col).filter(x=>x.id!==id));
  if(useDb){try{await db.collection(col).doc(id).delete();}catch(e){console.warn('No se pudo sincronizar el borrado con la base de datos',e);}}
}
async function loadAll(){
  state.workouts=await getAll('workouts');
  state.measurements=await getAll('measurements');
  state.goals=await getAll('goals');
  state.routines=await getAll('routines');
  state.cardio=await getAll('cardio');
}

function drawChart(id,labels,data,label,color){
  const ctx=document.getElementById(id);if(!ctx)return;
  if(charts[id])charts[id].destroy();
  charts[id]=new Chart(ctx,{type:'line',data:{labels,datasets:[{label,data,borderColor:color,backgroundColor:color+'33',tension:.3,fill:true,pointRadius:3}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#8b93a3'},grid:{display:false}},y:{ticks:{color:'#8b93a3'},grid:{color:'#252b36'}}}}});
}
function trendColor(pct){
  if(pct==null)return '#7fa8d9';
  if(pct>5)return '#22c55e';
  if(pct>0)return '#8fd19e';
  if(pct===0)return '#9aa5b8';
  if(pct>-5)return '#f5a35c';
  return '#ff6b6b';
}
function drawTrendChart(id,labels,data){
  const ctx=document.getElementById(id);if(!ctx)return;
  if(charts[id])charts[id].destroy();
  const pct=data.map((v,i)=>i===0||!data[i-1]?null:(v-data[i-1])/data[i-1]*100);
  const ptColors=data.map((v,i)=>trendColor(pct[i]));
  charts[id]=new Chart(ctx,{type:'line',data:{labels,datasets:[{data,borderWidth:3,pointRadius:5,pointBackgroundColor:ptColors,segment:{borderColor:c=>ptColors[c.p1DataIndex]||'#7fa8d9'},backgroundColor:'rgba(92,168,255,0.12)',fill:true,tension:.35}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>c.parsed.y+' kg'}}},scales:{x:{ticks:{color:'#8b93a3'},grid:{display:false}},y:{ticks:{color:'#8b93a3'},grid:{color:'#252b36'}}}}});
}

function render(){
  document.getElementById('headerSub').textContent=state.workouts.length||state.measurements.length?`${state.workouts.length} entrenamientos · ${state.measurements.length} medidas`:'Registra tu primer entrenamiento';
  if(currentTab==='entrenar')renderEntrenar();
  else if(currentTab==='rutinas')renderRutinas();
  else if(currentTab==='progreso')renderProgreso();
  else if(currentTab==='objetivos')renderObjetivos();
  else renderMedidas();
}

// ---------- CARDIO ----------
function cardioIcon(t){return t==='correr'?'🏃':t==='natacion'?'🏊':'🪢';}
function cardioNombre(t){return t==='correr'?'Correr':t==='natacion'?'Natación':'Comba';}
function cardioSummary(c){
  if(c.tipo==='correr')return `${c.km}km · ${c.tiempo}min`;
  if(c.tipo==='natacion')return `${c.largos} largos · ${c.tiempo}min`;
  return `${c.sets} sets × ${c.tiempoSet}s`;
}
function saveCardio(){
  const d=draftCardio;
  if(d.tipo==='correr'&&(!d.km||!d.tiempo)){alert('Indica los km y el tiempo');return;}
  if(d.tipo==='natacion'&&(!d.largos||!d.tiempo)){alert('Indica los largos y el tiempo');return;}
  if(d.tipo==='comba'&&(!d.sets||!d.tiempoSet)){alert('Indica los sets y el tiempo por set');return;}
  const data={tipo:d.tipo,fecha:d.fecha,esfuerzo:+(d.esfuerzo||70)};
  if(d.tipo==='correr'){data.km=+d.km;data.tiempo=+d.tiempo;}
  if(d.tipo==='natacion'){data.largos=+d.largos;data.tiempo=+d.tiempo;}
  if(d.tipo==='comba'){data.sets=+d.sets;data.tiempoSet=+d.tiempoSet;}
  addDoc('cardio',data).then(async()=>{draftCardio={...d,km:'',tiempo:'',largos:'',sets:'',tiempoSet:''};await loadAll();render();});
}
function delCardio(id){delDoc('cardio',id).then(async()=>{await loadAll();render();});}
function renderCardioForm(){
  const d=draftCardio;
  let fields='';
  if(d.tipo==='correr')fields=`<div class="row"><div><label>Km</label><input type="number" step="0.1" value="${d.km}" oninput="draftCardio.km=this.value"></div><div><label>Tiempo (min)</label><input type="number" value="${d.tiempo}" oninput="draftCardio.tiempo=this.value"></div></div>`;
  if(d.tipo==='natacion')fields=`<div class="row"><div><label>Largos</label><input type="number" value="${d.largos}" oninput="draftCardio.largos=this.value"></div><div><label>Tiempo (min)</label><input type="number" value="${d.tiempo}" oninput="draftCardio.tiempo=this.value"></div></div>`;
  if(d.tipo==='comba')fields=`<div class="row"><div><label>Sets</label><input type="number" value="${d.sets}" oninput="draftCardio.sets=this.value"></div><div><label>Tiempo por set (seg)</label><input type="number" value="${d.tiempoSet}" oninput="draftCardio.tiempoSet=this.value"></div></div>`;
  const hist=state.cardio.length?state.cardio.slice(0,20).map(c=>`<div class="item"><div>${cardioIcon(c.tipo)} <b>${cardioSummary(c)}</b><br><span class="pill">${fmtDate(c.fecha)}</span> <span style="font-size:11px;color:var(--sub)">Esfuerzo ${c.esfuerzo}%</span></div><button class="btn-ghost btn-sm" onclick="delCardio('${c.id}')">✕</button></div>`).join(''):'<div class="empty">Sin ejercicios aeróbicos registrados</div>';
  return `<div class="card"><h2>Nuevo cardio</h2>
    <div class="tag-row">${['correr','natacion','comba'].map(t=>`<span class="tag ${d.tipo===t?'active':''}" onclick="draftCardio.tipo='${t}';render()">${cardioIcon(t)} ${cardioNombre(t)}</span>`).join('')}</div>
    <label>Fecha</label><input type="date" value="${d.fecha}" oninput="draftCardio.fecha=this.value">
    ${fields}
    <label>Esfuerzo (%)</label><input type="number" value="${d.esfuerzo}" oninput="draftCardio.esfuerzo=this.value">
    <button class="btn-primary" onclick="saveCardio()">Guardar cardio</button></div>
    <div class="card"><h2>Historial cardio</h2>${hist}</div>`;
}

// ---------- RECORRIDO (onboarding) ----------
function onboardingDismissed(){try{return localStorage.getItem('fittrack_onboarding_dismissed')==='1';}catch(e){return false;}}
function dismissOnboarding(){try{localStorage.setItem('fittrack_onboarding_dismissed','1');}catch(e){}render();}
function onboardingCard(){
  if(onboardingDismissed())return '';
  const steps=[
    {done:state.measurements.length>0,label:'Registra tus medidas',tab:'medidas'},
    {done:state.goals.length>0,label:'Crea tu primer objetivo',tab:'objetivos'},
    {done:state.workouts.length>0,label:'Registra tu primer ejercicio',tab:'entrenar'},
    {done:state.routines.length>0,label:'Crea tu primera rutina',tab:'rutinas'}
  ];
  if(steps.every(s=>s.done)){try{localStorage.setItem('fittrack_onboarding_dismissed','1');}catch(e){}return '';}
  return `<div class="card" style="border-color:var(--accent)"><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">Primeros pasos</h2><button class="btn-ghost btn-sm" onclick="dismissOnboarding()">✕</button></div>${steps.map(s=>`<div style="display:flex;align-items:center;justify-content:space-between;padding:7px 0;cursor:pointer" onclick="setTab('${s.tab}')"><span style="font-size:13px;color:${s.done?'var(--sub)':'var(--text)'}">${s.done?'✅':'⬜'} ${s.label}</span><span style="color:var(--sub);font-size:16px">›</span></div>`).join('')}</div>`;
}

// ---------- ENTRENAR ----------
function addSet(){draftSets.push({peso:'',reps:'',esfuerzo:'80'});renderEntrenar();}
function removeSet(i){draftSets.splice(i,1);if(!draftSets.length)draftSets=[{peso:'',reps:'',esfuerzo:'80'}];renderEntrenar();}
function saveWorkout(){
  if(!draftEx.trim()){alert('Escribe el nombre del ejercicio');return;}
  const sets=draftSets.filter(s=>s.peso&&s.reps).map(s=>({peso:+s.peso,reps:+s.reps,esfuerzo:+(s.esfuerzo||80)}));
  if(!sets.length){alert('Añade al menos una serie con peso y repeticiones');return;}
  addDoc('workouts',{ejercicio:draftEx.trim(),fecha:draftDate,sets}).then(async()=>{
    draftEx='';draftSets=[{peso:'',reps:'',esfuerzo:'80'}];await loadAll();render();
  });
}
function delWorkout(id){delDoc('workouts',id).then(async()=>{await loadAll();render();});}
function lastWorkoutForExercise(name,date){
  if(!name)return null;
  return state.workouts.filter(w=>w.ejercicio===name&&(!date||w.fecha<date)).slice().sort((a,b)=>b.fecha.localeCompare(a.fecha))[0]||null;
}
function renderEntrenar(){
  const names=exerciseNames();
  const previous=lastWorkoutForExercise(draftEx,draftDate);
  const prevSets=previous?.sets||[];
  const setsHtml=draftSets.map((s,i)=>{
    const ps=prevSets[i];
    return `<div class="set-row">
    <input type="number" placeholder="${ps?ps.peso+' kg':''||'Kg'}" value="${s.peso}" oninput="draftSets[${i}].peso=this.value">
    <input type="number" placeholder="${ps?ps.reps+' reps':''||'Reps'}" value="${s.reps}" oninput="draftSets[${i}].reps=this.value">
    <input type="number" placeholder="${ps?ps.esfuerzo+'%':''||'%'}" value="${s.esfuerzo}" oninput="draftSets[${i}].esfuerzo=this.value">
    <button onclick="removeSet(${i})">✕</button></div>`;
  }).join('');
  const previousHint=previous?`<div style="margin:8px 0 2px;padding:8px 10px;border-radius:10px;background:var(--card2);color:var(--sub);font-size:11px">Última vez · ${fmtDate(previous.fecha)} · ${(previous.sets||[]).map(s=>s.peso+' kg × '+s.reps+' @ '+s.esfuerzo+'%').join(' · ')}</div>`:'';
  const histHtml=state.workouts.length?state.workouts.slice(0,25).map(w=>{
    const top=w.sets.reduce((a,s)=>s.peso>a.peso?s:a,w.sets[0]);
    const rm=Math.round(top.peso*(1+top.reps/30)*10)/10;
    return `<div class="item">
    <div><b>${w.ejercicio}</b><br><span class="pill">${fmtDate(w.fecha)}</span> <span style="font-size:12px;color:var(--sub)">${(w.sets||[]).map(s=>s.peso+'kg×'+s.reps+' ('+s.esfuerzo+'%)').join(' · ')}</span><br><span style="font-size:11px;color:var(--accent);font-weight:600">🏆 PR estimado (1RM): ${rm}kg</span></div>
    <button class="btn-ghost btn-sm" onclick="delWorkout('${w.id}')">✕</button></div>`;
  }).join(''):'<div class="empty">Aún no hay entrenamientos registrados</div>';
  const routineBanner=activeRoutine?`<div class="card" style="border-color:var(--accent)">
    <div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">Rutina: ${activeRoutine.nombre}</h2><button class="btn-ghost btn-sm" onclick="exitRoutine()">Salir</button></div>
    <div style="margin-top:6px">${activeRoutine.ejercicios.map(n=>{
      const hecho=state.workouts.some(w=>w.ejercicio===n&&w.fecha===draftDate);
      const sessions=state.workouts.filter(w=>w.ejercicio===n).slice().sort((a,b)=>a.fecha.localeCompare(b.fecha));
      const topOf=w=>w.sets.reduce((a,s)=>s.peso>a.peso?s:a,w.sets[0]);
      const last=sessions[sessions.length-1],prev=sessions[sessions.length-2];
      const lastTop=last?topOf(last):null,prevTop=prev?topOf(prev):null;
      const best=sessions.length?Math.max(...sessions.flatMap(w=>w.sets.map(s=>s.peso))):0;
      const pctBar=best&&lastTop?Math.round(lastTop.peso/best*100):0;
      const delta=prevTop&&lastTop?(lastTop.peso-prevTop.peso)/prevTop.peso*100:null;
      const col=trendColor(delta);
      return `<div style="padding:8px 0;border-bottom:1px solid var(--border);cursor:pointer" onclick="draftEx='${n.replace(/'/g,"\\'")}';render()">
        <div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:13px;${draftEx===n?'color:var(--accent)':''}">${hecho?'✓ ':''}${n}</b><span style="font-size:11px;color:${col}">${lastTop?lastTop.peso+'kg×'+lastTop.reps:'sin datos'}</span></div>
        <div class="progress" style="height:6px;margin-top:5px"><div style="width:${pctBar}%;background:${col}"></div></div>

// ---------- OBJETIVOS ----------
const ACT_FACTORS={sed:1.2,lig:1.375,mod:1.55,int:1.725,muyint:1.9};

const GOAL_STRATEGIES={
  volumen:{
    limpio:{base:0.05,label:'superávit pequeño'},
    normal:{base:0.10,label:'superávit moderado'},
    sucio:{base:0.15,label:'superávit alto'}
  },
  definicion:{
    suave:{base:-0.10,label:'déficit suave'},
    medio:{base:-0.15,label:'déficit moderado'},
    fuerte:{base:-0.20,label:'déficit alto'}
  },
  recomposicion:{
    volumen:{base:0.05,label:'ligero superávit'},
    normal:{base:-0.02,label:'cerca de mantenimiento'},
    definicion:{base:-0.08,label:'déficit ligero'}
  },
  acondicionamiento:{
    buena:{base:0.02,label:'mantenimiento / ligero margen'},
    normal:{base:0,label:'mantenimiento'},
    mala:{base:0.05,label:'mantenimiento / ligero superávit'}
  }
};

const GOAL_SUBS={
  volumen:[['limpio','Limpio'],['normal','Normal'],['sucio','Sucio']],
  definicion:[['suave','Suave'],['medio','Medio'],['fuerte','Fuerte']],
  recomposicion:[['volumen','Objetivo volumen'],['normal','Normal'],['definicion','Objetivo definición']],
  acondicionamiento:[['buena','Buena forma'],['normal','Normal'],['mala','Mala forma']]
};

function getDefaultSub(tipo){
  return (GOAL_SUBS[tipo]||[])[1]?.[0]||(GOAL_SUBS[tipo]||[])[0]?.[0]||'';
}

function latestMeasurement(){
  return state.measurements.slice().sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||''))[0]||null;
}

function calcBaseTDEE(g){
  const m=latestMeasurement();
  const edad=+m?.edad;
  if(!m||!m.peso||!m.altura||!edad)return null;
  const bmr=m.sexo==='F'
    ?10*m.peso+6.25*m.altura-5*edad-161
    :10*m.peso+6.25*m.altura-5*edad+5;
  return {bmr,tdee:bmr*(ACT_FACTORS[g.act]||1.375),edad};
}

function calcCalorias(g){
  const base=calcBaseTDEE(g);if(!base)return null;
  const strategy=GOAL_STRATEGIES[g.tipo]?.[g.sub];
  if(!strategy)return null;
  const meses=+g.meses||3;
  const plazoFactor=meses>=12?0.70:meses>=6?0.85:1;
  let pct=strategy.base*plazoFactor;
  pct=Math.max(-0.23,Math.min(0.18,pct));
  const kcal=Math.round(base.tdee*(1+pct)/10)*10;
  return {tdee:Math.round(base.tdee),kcal,pct,estrategia:strategy.label,edad:base.edad};
}

function trainingDaysSince(fechaInicio){return new Set(state.workouts.filter(w=>w.fecha>=fechaInicio).map(w=>w.fecha)).size;}

function currentValueFor(g){
  const m=latestMeasurement();
  return m?.peso!=null?m.peso:null;
}
function currentTrackingFor(g){
  const m=latestMeasurement();
  return {
    peso:m?.peso!=null?m.peso:null,
    grasa:m?.grasa!=null?m.grasa:null,
    magra:m?.magra!=null?m.magra:null,
    dias:trainingDaysSince(g.fechaInicio)
  };
}
function targetUnit(g){return 'kg';}
function metricProgress(current,initial,target,lowerIsBetter=false){
  if(current==null||initial==null||target==null||initial===target)return 0;
  const p=lowerIsBetter?(initial-current)/(initial-target)*100:(current-initial)/(target-initial)*100;
  return Math.max(0,Math.min(100,p));
}
function weightProgress(g,current){
  const initial=g.inicial!=null?+g.inicial:null, target=g.objetivo!=null?+g.objetivo:null;
  if(initial==null||target==null)return 0;
  if(target===initial)return current!=null&&Math.abs(current-target)<0.05?100:0;
  return metricProgress(current,initial,target,target<initial);
}

function goalLabel(g){
  const sub=(GOAL_SUBS[g.tipo]||[]).find(x=>x[0]===g.sub);
  const main={definicion:'Definición',volumen:'Volumen',recomposicion:'Recomposición',acondicionamiento:'Acondicionamiento'}[g.tipo]||g.tipo;
  return main+(sub?' · '+sub[1]:'');
}

function pctGoalProgress(g,cur){return weightProgress(g,cur);}

    const primary=`<div class="goal-metric-card"><div class="metric-head"><b>🎯 Peso corporal</b><b>${actual!=null?actual.toFixed(1):'—'} kg actual</b></div><div class="goal-progress"><div style="width:${pct}%"></div></div><div class="goal-three-values"><span><small>Inicial</small><b>${initial!=null?initial.toFixed(1):'—'} kg</b></span><span class="current"><small>Actual</small><b>${actual!=null?actual.toFixed(1):'—'} kg</b></span><span><small>Objetivo</small><b>${target!=null?target.toFixed(1):'—'} kg</b></span></div></div>`;

ick="saveGoal()">${formButton}</button>${editingGoalId?`<button class="btn-ghost" style="margin-top:14px" onclick="cancelEditGoal()">Cancelar</button>`:''}</div>${latest?.edad?`<div style="margin-top:9px;font-size:11px;color:var(--sub)">Edad utilizada: ${latest.edad} años · tomada de tu última medida.</div>`:`<div class="empty" style="padding:10px 0">Primero registra tu edad en Medidas.</div>`}</div>`;

// ---------- MEDIDAS ----------
function calcGrasa(){
  const {sexo,cuello,cintura,altura,cadera}=draftMed;
  if(!cuello||!cintura||!altura)return null;
  let g;
  if(sexo==='M')g=495/(1.0324-0.19077*Math.log10(cintura-cuello)+0.15456*Math.log10(altura))-450;
  else{if(!cadera)return null;g=495/(1.29579-0.35004*Math.log10(+cintura+ +cadera-cuello)+0.22100*Math.log10(altura))-450;}
  return isFinite(g)?Math.max(3,Math.min(60,g)):null;
}
function medPreviewHtml(){
  const g=calcGrasa();
  if(g==null)return '<div class="empty">Completa cuello, cintura(, cadera) y altura para calcular</div>';
  const imc=draftMed.peso&&draftMed.altura?(draftMed.peso/((draftMed.altura/100)**2)).toFixed(1):'--';
  return `<div class="statgrid"><div class="stat"><b>${g.toFixed(1)}%</b><span>Grasa corporal</span></div><div class="stat"><b>${(100-g).toFixed(1)}%</b><span>Masa magra</span></div><div class="stat"><b>${imc}</b><span>IMC</span></div></div>`;
}
function updateMedField(k,v){draftMed[k]=v;const p=document.getElementById('medPreview');if(p)p.innerHTML=medPreviewHtml();}
function selMedMetric(m){selectedMedMetric=m;render();}
function saveMed(){
  if(!draftMed.edad||+draftMed.edad<1){alert('Introduce tu edad');return;}
  if(!draftMed.edad){alert('Introduce tu edad');return;}
  if(!draftMed.peso||!draftMed.altura){alert('Introduce al menos peso y altura');return;}
  const g=calcGrasa();
  const num=v=>v?+v:null;
  const data={fecha:draftMed.fecha,sexo:draftMed.sexo,edad:+draftMed.edad,peso:+draftMed.peso,altura:+draftMed.altura,cuello:num(draftMed.cuello),cintura:num(draftMed.cintura),cadera:num(draftMed.cadera),pecho:num(draftMed.pecho),biceps:num(draftMed.biceps),pierna:num(draftMed.pierna),grasa:g,magra:g!=null?100-g:null};
  addDoc('measurements',data).then(async()=>{await loadAll();render();});
}
function delMed(id){delDoc('measurements',id).then(async()=>{await loadAll();render();});}
function renderMedidas(){
  const metrics=[['peso','Peso'],['grasa','Grasa %'],['magra','Magra %'],['cuello','Cuello'],['pecho','Pecho'],['biceps','Bíceps'],['pierna','Pierna'],['cintura','Cintura']];
  const tags=metrics.map(m=>`<span class="tag ${selectedMedMetric===m[0]?'active':''}" onclick="selMedMetric('${m[0]}')">${m[1]}</span>`).join('');
  const histHtml=state.measurements.length?state.measurements.slice(0,20).map(m=>`<div class="item"><div><b>${m.peso}kg</b>${m.grasa?' · '+m.grasa.toFixed(1)+'% grasa':''}<br><span class="pill">${fmtDate(m.fecha)}</span></div><button class="btn-ghost btn-sm" onclick="delMed('${m.id}')">✕</button></div>`).join(''):'<div class="empty">Sin medidas registradas</div>';
  main.innerHTML=`<div class="card"><h2>Nueva medida</h2>
    <div class="row"><div><label>Sexo</label><select onchange="draftMed.sexo=this.value;render()">
      <option value="M" ${draftMed.sexo==='M'?'selected':''}>Hombre</option>
      <option value="F" ${draftMed.sexo==='F'?'selected':''}>Mujer</option></select></div>
      <div><label>Fecha</label><input type="date" value="${draftMed.fecha}" oninput="draftMed.fecha=this.value"></div></div>
    <label>Edad (años)</label><input type="number" min="1" max="120" value="${draftMed.edad}" oninput="updateMedField('edad',this.value)">
    <div class="row"><div><label>Peso (kg)</label><input type="number" value="${draftMed.peso}" oninput="updateMedField('peso',this.value)"></div>
      <div><label>Altura (cm)</label><input type="number" value="${draftMed.altura}" oninput="updateMedField('altura',this.value)"></div></div>
    <div class="row"><div><label>Cuello (cm)</label><input type="number" value="${draftMed.cuello}" oninput="updateMedField('cuello',this.value)"></div>
      <div><label>Cintura (cm)</label><input type="number" value="${draftMed.cintura}" oninput="updateMedField('cintura',this.value)"></div></div>
    ${draftMed.sexo==='F'?`<label>Cadera (cm)</label><input type="number" value="${draftMed.cadera}" oninput="updateMedField('cadera',this.value)">`:''}
    <div class="row"><div><label>Pecho (cm)</label><input type="number" value="${draftMed.pecho}" oninput="draftMed.pecho=this.value"></div>
      <div><label>Bíceps (cm)</label><input type="number" value="${draftMed.biceps}" oninput="draftMed.biceps=this.value"></div></div>
    <label>Pierna (cm)</label><input type="number" value="${draftMed.pierna}" oninput="draftMed.pierna=this.value">
    <div id="medPreview">${medPreviewHtml()}</div>
    <button class="btn-primary" onclick="saveMed()">Guardar medida</button></div>
    <div class="card"><h2>Evolución</h2><div class="tag-row">${tags}</div><div class="chart-wrap"><canvas id="chartMed"></canvas></div></div>
    <div class="card"><h2>Historial</h2>${histHtml}</div>`;
  const ordered=state.measurements.slice().sort((a,b)=>a.fecha.localeCompare(b.fecha)).filter(m=>m[selectedMedMetric]!=null);
  drawChart('chartMed',ordered.map(m=>fmtDate(m.fecha)),ordered.map(m=>m[selectedMedMetric]),metrics.find(x=>x[0]===selectedMedMetric)[1],'#FF7A45');
}

// ---------- INIT ----------
function setTab(name){currentTab=name;document.querySelectorAll('.tabbar button').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));render();}
document.querySelectorAll('.tabbar button').forEach(b=>{b.onclick=()=>setTab(b.dataset.tab);});
(async()=>{
  try{if(window.claude&&window.claude.use){db=await window.claude.use('db');}}catch(e){}
  useDb=!!db;
  await loadAll();
  render();
})();
</script>
</body>
</html>
